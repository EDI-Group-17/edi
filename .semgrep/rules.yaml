rules:
  # Python / FastAPI Rules
  - id: fastapi-hardcoded-secret
    patterns:
      - pattern: $SECRET = "..."
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i)(password|secret|token|key)
    message: "Hardcoded secret detected. Use environment variables instead."
    languages: [python]
    severity: ERROR

  - id: fastapi-sql-injection
    patterns:
      - pattern: $DB.execute(f"SELECT * FROM {...}")
    message: "Potential SQL injection using f-strings in database execution. Use parameterized queries."
    languages: [python]
    severity: ERROR

  # React / JS / TS Rules
  - id: react-dangerously-set-innerhtml
    patterns:
      - pattern: dangerouslySetInnerHTML={...}
    message: "Avoid using dangerouslySetInnerHTML as it can lead to XSS vulnerabilities. If absolutely necessary, ensure input is sanitized."
    languages: [javascript, typescript, jsx, tsx]
    severity: WARNING

  - id: react-no-target-blank
    patterns:
      - pattern: <a target="_blank" href="...">
      - pattern-not: <a target="_blank" rel="noopener noreferrer" href="...">
    message: "Using target='_blank' without rel='noopener noreferrer' is a security risk."
    languages: [javascript, typescript, jsx, tsx]
    severity: ERROR
